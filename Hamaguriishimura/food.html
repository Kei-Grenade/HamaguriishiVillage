<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/food.css" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <h1>hamaguri</h1>
    <div class="visial" style="text-align: center;">
        <div class="goheimochi flex">
            <div class="menu_front">
                <div class="menue_info flex">
                    <div class="menu_name">
                        <h3>五平餅</h3>
                    </div>
                    <div class="food">
                        <img class="goheimochi" src="images/goheimochi.jpeg" alt="五平餅">
                        <p style="font-size: 17px; width: 580px;">中部地方に伝わる郷土料理。蛤石村に伝わる独自のタレをつけ、粳米(うるちまい)の食感が残る香ばしく味わい深い一品。</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="zarigani flex">
            <div class="menu_front">
                <div class="menue_info flex">
                    <div class="food">
                        <img class="zarigani" src="images/zarigani.jpeg" alt="ザリガニの素揚げ">
                        <p style="font-size: 17px; width: 580px;">蛤石村を流れる清流で得ることのできるウチダザリガニの素揚げ。高温な油でさっと素揚げすることにより外はカリッとした食感。中身は噛みごたえのあるぷりっとした食感をお楽しみ頂けます。</p>
                    </div>
                    <div class="menu_name">
                        <h3>ザリガニの素揚げ</h3>
                    </div>
                </div>
            </div>
        </div>
        <div class="hebi flex">
            <div class="menu_front">
                <div class="menue_info flex">
                    <div class="menu_name">
                        <h3>蛇の蒲焼</h3>
                    </div>
                    <div class="food">
                        <img class="hebi" src="images/hebi.jpeg" alt="蛇の蒲焼">
                        <p style="font-size: 17px; width: 580px;">大自然に囲まれた蛤石村だからこそ豊富に取れるアオダイショウを蒲焼でお召し上がりください。ふんだんに塗ってある伝統的な濃厚なタレにあなたは虜になるでしょう。</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
